  </defs>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#background)"/>
  <rect x="19" y="19" width="474" height="474" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M190 145 126 256l64 111M322 145l64 111-64 111" fill="none" stroke="#6D7DE0" stroke-opacity="0.28" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M190 145 126 256l64 111M322 145l64 111-64 111" fill="none" stroke="url(#brackets)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m211 264 39 40 68-94" fill="none" stroke="#5678C8" stroke-opacity="0.35" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="m211 264 39 40 68-94" fill="none" stroke="url(#check)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
