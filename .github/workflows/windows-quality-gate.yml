name: Windows 质量门禁

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查、测试、构建与交付检查
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出完整仓库历史
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 pnpm 与 Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.12.0
          cache: true
          install: false

      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型检查
        run: pnpm run check

      - name: 桌面展示与状态合同
        run: pnpm run test:desktop

      - name: 运行自动化测试
        run: pnpm test

      - name: 构建桌面应用
        run: pnpm run build

      - name: 检查交付材料与仓库安全
        run: pnpm run verify:delivery

      - name: 生成 Windows x64 应用
        if: github.event_name != 'pull_request'
        run: node scripts/package-windows.mjs

      - name: 上传可运行应用
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: RepoForge-Windows-x64-${{ github.sha }}
          path: release/RepoForge-win32-x64
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: 下载已验证应用
        uses: actions/download-artifact@v5
        with:
          name: RepoForge-Windows-x64-${{ github.sha }}
          path: release-assets

      - name: 生成发布压缩包
        shell: pwsh
        run: Compress-Archive -Path "release-assets\*" -DestinationPath "RepoForge-Windows-x64.zip" -CompressionLevel Optimal

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "RepoForge-Windows-x64.zip#Windows x64 免安装版" --verify-tag --generate-notes --title "RepoForge 代码锻造智能体 $env:GITHUB_REF_NAME"
