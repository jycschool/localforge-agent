<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LocalForge VS Code extension prototype</title>
  <desc id="desc">A VS Code-like window with file explorer, code diff, terminal output, and a LocalForge agent sidebar showing task progress and command approval.</desc>
  <rect width="1440" height="900" fill="#181818"/>
  <rect x="0" y="0" width="1440" height="38" fill="#202020"/>
  <text x="18" y="25" fill="#cccccc" font-family="Segoe UI, Arial" font-size="14">File   Edit   Selection   View   Go   Run   Terminal   Help</text>
  <text x="671" y="25" text-anchor="middle" fill="#bdbdbd" font-family="Segoe UI, Arial" font-size="13">LocalForge - demo-project</text>

  <rect x="0" y="38" width="52" height="862" fill="#242424"/>
  <g fill="none" stroke="#b8b8b8" stroke-width="2">
    <path d="M17 65h18v23H17z M22 60h18v23"/>
    <circle cx="26" cy="125" r="10"/><path d="M34 133l8 8"/>
    <path d="M17 172h19v19H17z M21 168h19v19"/>
    <path d="M17 223h22v17H17z M21 218h14l4 5"/>
  </g>
  <rect x="49" y="58" width="3" height="38" fill="#4daafc"/>

  <rect x="52" y="38" width="238" height="862" fill="#1f1f1f"/>
  <text x="68" y="69" fill="#bbbbbb" font-family="Segoe UI, Arial" font-size="12" letter-spacing="1">EXPLORER</text>
  <text x="68" y="106" fill="#dedede" font-family="Segoe UI, Arial" font-size="12" font-weight="600">⌄  DEMO-PROJECT</text>
  <g fill="#cccccc" font-family="Consolas, monospace" font-size="13">
    <text x="82" y="136">⌄ src</text>
    <text x="104" y="164">config.ts</text>
    <text x="104" y="192">env.ts</text>
    <text x="82" y="226">⌄ tests</text>
    <text x="104" y="254">config.test.ts</text>
    <text x="82" y="288">package.json</text>
    <text x="82" y="318">README.md</text>
  </g>

  <rect x="290" y="38" width="744" height="568" fill="#1e1e1e"/>
  <rect x="290" y="38" width="744" height="38" fill="#252526"/>
  <rect x="304" y="45" width="176" height="31" fill="#1e1e1e"/>
  <text x="323" y="66" fill="#dddddd" font-family="Segoe UI, Arial" font-size="13">config.ts ↔ Modified</text>
  <rect x="290" y="76" width="372" height="530" fill="#1d2228"/>
  <rect x="662" y="76" width="372" height="530" fill="#20251f"/>
  <text x="306" y="101" fill="#999999" font-family="Segoe UI, Arial" font-size="11">BEFORE</text>
  <text x="678" y="101" fill="#999999" font-family="Segoe UI, Arial" font-size="11">AFTER</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="308" y="137" fill="#9cdcfe">export function loadConfig() {'{'}</text>
    <text x="326" y="166" fill="#dcdcaa">return readFileConfig();</text>
    <text x="308" y="195" fill="#9cdcfe">{'}'}</text>
    <rect x="290" y="148" width="372" height="30" fill="#4b2222" opacity="0.65"/>

    <text x="680" y="137" fill="#9cdcfe">export function loadConfig() {'{'}</text>
    <rect x="662" y="146" width="372" height="60" fill="#214b2d" opacity="0.72"/>
    <text x="698" y="166" fill="#dcdcaa">return mergeConfig(</text>
    <text x="716" y="194" fill="#ce9178">readFileConfig(), process.env</text>
    <text x="698" y="222" fill="#dcdcaa">);</text>
    <text x="680" y="250" fill="#9cdcfe">{'}'}</text>
  </g>

  <rect x="290" y="606" width="744" height="294" fill="#181818"/>
  <rect x="290" y="606" width="744" height="38" fill="#202020"/>
  <text x="310" y="631" fill="#e6e6e6" font-family="Segoe UI, Arial" font-size="12">PROBLEMS   OUTPUT   DEBUG CONSOLE   <tspan fill="#ffffff" font-weight="600">TERMINAL</tspan></text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="310" y="676" fill="#cccccc">&gt; npm test -- config.test.ts</text>
    <text x="310" y="708" fill="#73c991">✓ environment variables override file values</text>
    <text x="310" y="736" fill="#73c991">✓ unknown variables are ignored</text>
    <text x="310" y="775" fill="#cccccc">Tests: 2 passed, 2 total</text>
    <text x="310" y="803" fill="#cccccc">Time: 0.81s</text>
  </g>

  <rect x="1034" y="38" width="406" height="862" fill="#202020"/>
  <rect x="1034" y="38" width="406" height="54" fill="#252526"/>
  <text x="1054" y="71" fill="#f1f1f1" font-family="Segoe UI, Arial" font-size="15" font-weight="600">LOCALFORGE</text>
  <rect x="1323" y="51" width="92" height="29" rx="4" fill="#3c3c3c"/>
  <text x="1369" y="70" text-anchor="middle" fill="#eeeeee" font-family="Segoe UI, Arial" font-size="12">■ Stop</text>

  <text x="1054" y="125" fill="#969696" font-family="Segoe UI, Arial" font-size="11">CURRENT TASK</text>
  <text x="1054" y="154" fill="#eeeeee" font-family="Segoe UI, Arial" font-size="14">Add environment variable overrides</text>
  <text x="1054" y="178" fill="#eeeeee" font-family="Segoe UI, Arial" font-size="14">and update tests.</text>
  <rect x="1054" y="200" width="155" height="28" rx="4" fill="#333333"/>
  <text x="1070" y="219" fill="#d8d8d8" font-family="Segoe UI, Arial" font-size="11">config.ts · selected</text>

  <line x1="1072" y1="260" x2="1072" y2="553" stroke="#555555" stroke-width="2"/>
  <g font-family="Segoe UI, Arial">
    <circle cx="1072" cy="278" r="8" fill="#3fb950"/>
    <text x="1094" y="282" fill="#e5e5e5" font-size="13">Read 4 related files</text>
    <text x="1094" y="304" fill="#999999" font-size="11">1.2s · click to inspect</text>

    <circle cx="1072" cy="344" r="8" fill="#3fb950"/>
    <text x="1094" y="348" fill="#e5e5e5" font-size="13">Edited config.ts and tests</text>
    <text x="1094" y="370" fill="#999999" font-size="11">2 files · +18 −3</text>

    <circle cx="1072" cy="410" r="8" fill="#f0a020"/>
    <text x="1094" y="414" fill="#e5e5e5" font-size="13">Test failed</text>
    <text x="1094" y="436" fill="#c6c6c6" font-size="11">Expected number, received string</text>

    <circle cx="1072" cy="476" r="8" fill="#3fb950"/>
    <text x="1094" y="480" fill="#e5e5e5" font-size="13">Fixed coercion and reran tests</text>
    <text x="1094" y="502" fill="#73c991" font-size="11">2 tests passed</text>

    <circle cx="1072" cy="542" r="8" fill="#4daafc"/>
    <text x="1094" y="546" fill="#e5e5e5" font-size="13">Ready for review</text>
  </g>

  <rect x="1054" y="580" width="360" height="104" rx="5" fill="#292929" stroke="#424242"/>
  <text x="1072" y="608" fill="#eeeeee" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Validation</text>
  <text x="1072" y="633" fill="#73c991" font-family="Segoe UI, Arial" font-size="12">✓ Focused tests passed</text>
  <text x="1072" y="656" fill="#c8c8c8" font-family="Segoe UI, Arial" font-size="11">2 changed files are ready to inspect.</text>
  <rect x="1269" y="598" width="126" height="32" rx="4" fill="#0e639c"/>
  <text x="1332" y="619" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12">Open Diff</text>

  <rect x="1054" y="718" width="360" height="116" rx="5" fill="#292929" stroke="#515151"/>
  <text x="1070" y="746" fill="#8f8f8f" font-family="Segoe UI, Arial" font-size="12">Ask for a follow-up change...</text>
  <rect x="1327" y="788" width="68" height="30" rx="4" fill="#0e639c"/>
  <text x="1361" y="808" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12">Send</text>
  <text x="1054" y="865" fill="#888888" font-family="Segoe UI, Arial" font-size="11">Local execution · Commands require approval</text>
</svg>

