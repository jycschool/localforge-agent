<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LocalForge standalone desktop agent prototype</title>
  <desc id="desc">A dark standalone desktop window with a project tree and changed files on the left, read-only code and command output in the center, and an agent task timeline with command approval on the right.</desc>
  <defs>
    <style>
      .ui { font-family: "Segoe UI Variable Text", Inter, "Segoe UI", Arial, sans-serif; fill: #f2f3f7; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; fill: #cbd2da; }
