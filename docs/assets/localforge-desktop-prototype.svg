      .faint { fill: #676e7d; }
      .tiny { font-size: 10px; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .heading { font-size: 15px; font-weight: 600; }
      .title { font-size: 18px; font-weight: 600; }
      .rule { stroke: #252a37; stroke-width: 1; }
      .code { font-size: 12px; }
      [fill="#0b0d10"] { fill: #0b0c11; }
      [fill="#0e1115"], [fill="#111419"] { fill: #11131a; }
      [fill="#161a20"] { fill: #171a23; }
      [fill="#1c2129"] { fill: #1d2130; }
      [fill="#0c0f13"], [fill="#090b0e"] { fill: #0d0f15; }
      [fill="#d9f99d"] { fill: #aebcff; }
      [fill="#18200d"] { fill: #15182b; }
      [stroke="#3a424d"] { stroke: #353b4b; }
    </style>
