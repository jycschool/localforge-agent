  <text x="1032" y="85" text-anchor="end" class="ui muted tiny" letter-spacing="1">FILE</text>

  <g class="mono code">
    <text x="288" y="134" class="faint">1</text><text x="322" y="134" fill="#8ab4f8">export interface</text><text x="430" y="134"> AgentRunOptions {</text>
    <text x="288" y="156" class="faint">2</text><text x="338" y="156">task: string;</text>
    <text x="288" y="178" class="faint">3</text><text x="338" y="178">systemPrompt: string;</text>
    <text x="288" y="200" class="faint">4</text><text x="338" y="200">maxSteps: number;</text>
    <text x="288" y="222" class="faint">5</text><text x="338" y="222">signal: AbortSignal;</text>
    <text x="288" y="244" class="faint">6</text><text x="322" y="244">}</text>
    <text x="288" y="288" class="faint">8</text><text x="322" y="288" fill="#8ab4f8">export class</text><text x="402" y="288"> AgentLoop {</text>
    <text x="282" y="310" class="faint">9</text><text x="338" y="310" fill="#d9f99d">public async</text><text x="421" y="310"> run(options: AgentRunOptions) {</text>
    <rect x="317" y="321" width="645" height="24" fill="#151b18"/>
    <text x="276" y="339" class="faint">10</text><text x="354" y="339">options.onEvent({ type: "run_started", task: options.task });</text>
    <text x="276" y="361" class="faint">11</text><text x="354" y="361" fill="#8ab4f8">for</text><text x="376" y="361"> (let step = 1; step &lt;= options.maxSteps; step += 1) {</text>
    <text x="276" y="383" class="faint">12</text><text x="370" y="383">const assistant = await this.model.complete(...);</text>
    <text x="276" y="405" class="faint">13</text><text x="370" y="405">const calls = assistant.tool_calls ?? [];</text>
    <text x="276" y="427" class="faint">14</text><text x="370" y="427" fill="#8ab4f8">if</text><text x="388" y="427"> (calls.length === 0) return completed(...);</text>
    <text x="276" y="449" class="faint">15</text><text x="370" y="449">await this.registry.execute(call.function.name, ...);</text>
    <text x="276" y="471" class="faint">16</text><text x="354" y="471">}</text>
    <text x="276" y="493" class="faint">17</text><text x="338" y="493">}</text>
    <text x="276" y="515" class="faint">18</text><text x="322" y="515">}</text>
  </g>

